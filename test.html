<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agentic System</title>
<style>
:root{
  /* Basic Styling */
  --background-color: #111;
  --background-transparent: #111111CC;
  --primary-color: #5fbff8;
  --hover-color: wheat;
  --border: 0.9px solid var(--primary-color);
  --border-hover: 0.9px solid var(--hover-color);
  --border-transparent: 0.01rem solid transparent;
  --radius-circle: 50%;
  --radius-rounded: 0.5rem;

  /* Perfect fourth typographic scale */
  --font-size-sm: 0.75rem;
  --font-size-base: 1rem;
  --font-size-md: 1.33rem;
  --font-size-lg: 1.77rem;
}

body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: var(--background-color);
  color: #fff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Landing screen */
#landing {
  text-align: center;
  width: 90%;
  max-width: 600px;
}

h1 {
  font-size: var(--font-size-lg);
  margin-bottom: 1.5rem;
  color: var(--primary-color);
}

.input-box {
  display: flex;
  align-items: center;
  background: var(--background-transparent);
  border: var(--border);
  border-radius: 50px;
  padding: 0.5rem 1rem;
  margin-bottom: 1rem;
}

.input-box input {
  flex: 1;
  border: none;
  outline: none;
  font-size: var(--font-size-base);
  padding: 0.75rem;
  background: transparent;
  color: #fff;
}

.input-box button {
  background: var(--primary-color);
  border: none;
  color: #111;
  padding: 0.75rem 1.25rem;
  border-radius: 50px;
  cursor: pointer;
  font-size: var(--font-size-base);
  transition: 0.2s;
}
.input-box button:hover {
  background: var(--hover-color);
  color: #111;
}

.options {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.options button {
  background: var(--background-transparent);
  border: var(--border);
  border-radius: 30px;
  padding: 0.6rem 1.2rem;
  cursor: pointer;
  font-size: var(--font-size-sm);
  color: var(--primary-color);
  transition: all 0.2s ease;
}
.options button:hover {
  border: var(--border-hover);
  color: var(--hover-color);
}

/* Chat interface */
#chatUI {
  display: none;
  flex-direction: column;
  height: 100vh;
  width: 100%;
}

header {
  padding: 1rem;
  background: var(--background-transparent);
  border-bottom: var(--border);
  text-align: center;
  font-weight: bold;
  color: var(--primary-color);
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.message {
  max-width: 70%;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-rounded);
  line-height: 1.4;
  word-wrap: break-word;
}
.user {
  align-self: flex-end;
  background: var(--primary-color);
  color: #111;
  border-bottom-right-radius: 0;
}
.ai {
  align-self: flex-start;
  background: var(--background-transparent);
  border: var(--border);
  border-bottom-left-radius: 0;
}

#inputBar {
  display: flex;
  padding: 0.75rem;
  background: var(--background-transparent);
  border-top: var(--border);
}
#userInputChat {
  flex: 1;
  padding: 0.75rem;
  border: var(--border);
  border-radius: var(--radius-rounded);
  font-size: var(--font-size-base);
  background: transparent;
  color: #fff;
}
#sendBtnChat {
  margin-left: 0.5rem;
  padding: 0 1.25rem;
  border: none;
  border-radius: var(--radius-rounded);
  background: var(--primary-color);
  color: #111;
  font-size: var(--font-size-base);
  cursor: pointer;
}

/* Popup modal */
.modal {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}
.modal-content {
  background: var(--background-color);
  border: var(--border);
  padding: 2rem;
  border-radius: var(--radius-rounded);
  max-width: 400px;
  text-align: center;
}
.modal-content h2 {
  color: var(--primary-color);
  margin-bottom: 1rem;
}
.modal-content button {
  margin-top: 1rem;
  padding: 0.5rem 1rem;
  border: var(--border);
  background: transparent;
  color: var(--primary-color);
  border-radius: var(--radius-rounded);
  cursor: pointer;
}
.modal-content button:hover {
  border: var(--border-hover);
  color: var(--hover-color);
}
</style>
</head>
<body>

<!-- Landing -->
<div id="landing">
  <h1>Welcome to Your AI Agentic System</h1>
  <div class="input-box">
    <input id="landingInput" type="text" placeholder="Type your request..." />
    <button id="landingSend">➤</button>
  </div>
  <div class="options">
    <button onclick="openModal('Create Agent')">Create Agent</button>
    <button onclick="openModal('Browse Agents')">Browse Agents</button>
    <button onclick="openModal('Settings')">Settings</button>
  </div>
</div>

<!-- Chat UI -->
<div id="chatUI">
  <header>AI Agentic System</header>
  <main id="chat">
    <div class="message ai">Hello! How can I help you today?</div>
  </main>
  <div id="inputBar">
    <input id="userInputChat" type="text" placeholder="Type your request..." />
    <button id="sendBtnChat">➤</button>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p>This is a demo popup for this section. You can add interactivity here.</p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const landing = document.getElementById("landing");
const chatUI = document.getElementById("chatUI");
const landingInput = document.getElementById("landingInput");
const landingSend = document.getElementById("landingSend");

const chat = document.getElementById("chat");
const userInputChat = document.getElementById("userInputChat");
const sendBtnChat = document.getElementById("sendBtnChat");

function switchToChat(initialText) {
  landing.style.display = "none";
  chatUI.style.display = "flex";
  if(initialText){
    addMessage(initialText, "user");
    fakeAIResponse(initialText);
  }
}

function addMessage(text, sender) {
  const msg = document.createElement("div");
  msg.classList.add("message", sender);
  msg.textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function fakeAIResponse(userText) {
  setTimeout(() => {
    addMessage("Echo: " + userText, "ai");
  }, 800);
}

function sendMessage() {
  const text = userInputChat.value.trim();
  if (!text) return;
  addMessage(text, "user");
  userInputChat.value = "";
  fakeAIResponse(text);
}

// Landing input → switch to chat
landingSend.addEventListener("click", () => {
  const text = landingInput.value.trim();
  switchToChat(text);
});
landingInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") switchToChat(landingInput.value.trim());
});

// Chat input → send messages
sendBtnChat.addEventListener("click", sendMessage);
userInputChat.addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendMessage();
});

// Modal handling
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");

function openModal(title) {
  modalTitle.textContent = title;
  modal.style.display = "flex";
}
function closeModal() {
  modal.style.display = "none";
}
</script>
