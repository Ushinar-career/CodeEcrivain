<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Help</title>
  <link rel="icon" href="../../assets/images/earth_logo_hq.png">
  <link rel="stylesheet" href="../css/help.css" />
  <script src="../js/marked.min.js"></script>
</head>
<body>
  <!-- Fixed Header -->
  <header class="header-bar">
    <img src="../../assets/images/earth_logo_hq.png" alt="Logo" class="logo" />
    <h1>Help</h1>
  </header>

  <!-- Main layout (below fixed header) -->
  <div class="main-layout">
    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Help topics">
      <div class="sidebar-top">
        <span class="sidebar-title">TOPICS</span>
        <button class="sidebar-toggle" aria-label="Toggle topics">☰</button>
      </div>
      <div class="sidebar-links"></div>
    </nav>

    <!-- Content -->
    <div class="content">Loading help...</div>
  </div>

  <script>
    // Utility: smooth scroll accounting for fixed header
    function scrollToHeading(targetEl) {
      const headerHeight = document.querySelector('.header-bar').offsetHeight || 64;
      const elementTop = targetEl.getBoundingClientRect().top + window.scrollY;
      const offsetTop = elementTop - headerHeight;
      window.scrollTo({ top: offsetTop, behavior: 'smooth' });
    }

    async function loadMarkdown() {
      try {
        const response = await fetch("ReadMe.md");
        if (!response.ok) {
          throw new Error(`Failed to load ReadMe.md: ${response.statusText}`);
        }

        const markdownText = await response.text();

        const contentEl = document.querySelector(".content");
        contentEl.innerHTML = marked.parse(markdownText);

        // Ensure headings have IDs and apply scroll offset behavior
        const headings = contentEl.querySelectorAll("h1, h2, h3, h4, h5, h6");
        headings.forEach((heading, index) => {
          if (!heading.id) heading.id = "heading-" + index;
          // CSS handles default anchor scroll offset via scroll-margin-top,
          // but we also support JS-based smooth scroll when clicking sidebar links.
          heading.classList.add('anchor-target');
        });

        // Build sidebar links
        const sidebarLinksEl = document.querySelector(".sidebar-links");
        sidebarLinksEl.innerHTML = "";
        headings.forEach((heading) => {
          const link = document.createElement("a");
          link.href = "#" + heading.id;
          link.textContent = heading.textContent;

          // Indent based on heading level
          const level = parseInt(heading.tagName.substring(1), 10);
          link.className = `topic-link level-${level}`;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const target = document.getElementById(heading.id);
            if (target) scrollToHeading(target);
            // Update URL hash without triggering native jump
            history.replaceState(null, "", `#${heading.id}`);
          });

          sidebarLinksEl.appendChild(link);
        });

        // If page is refreshed with a hash, reset to top (initial starting point)
        history.replaceState(null, "", window.location.pathname);
        window.scrollTo({ top: 0, behavior: 'instant' });
      } catch (error) {
        const contentEl = document.querySelector(".content");
        contentEl.textContent = "Error loading help content.";
        console.error(error);
      }
    }

    // Sidebar collapsing
    function initSidebarToggle() {
      const toggleBtn = document.querySelector(".sidebar-toggle");
      const sidebar = document.querySelector(".sidebar");
      const mainLayout = document.querySelector(".main-layout");

      function applyLayout() {
        const collapsed = sidebar.classList.contains("collapsed");
        mainLayout.style.setProperty('--sidebar-current-width', collapsed ? '52px' : '260px');
      }

      toggleBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
        applyLayout();
      });

      applyLayout(); // set initial width
    }

    // Initialize
    loadMarkdown().then(() => {
      initSidebarToggle();
    });

    // Prevent native anchor jump when hash changes due to any external cause
    window.addEventListener('hashchange', (e) => {
      e.preventDefault();
      const id = location.hash.slice(1);
      const target = id ? document.getElementById(id) : null;
      if (target) scrollToHeading(target);
    });
  </script>
</body>
</html>
