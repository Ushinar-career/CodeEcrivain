<!-- Chat Container Content -->
<div class="chat-container hidden">
    <header class="chat-header">
        <div class="chat-header-logo">
            <img src="assets\images\earth_logo_hq.png" title="AI Chat" alt="Header logo">
            <p class="section-text-base">MYA</p>
        </div>
        <div class="options">
            <button class="material-icons new-icon" title="New Chat">add</button>
            <button class="material-icons history-icon" title="History is stored locally in your browser.">history</button>
        </div>
        <div class="history-section hidden">
            No history yet.
        </div>
    </header>
    <main class="chat-section">
    </main>
    <div class="chat-container-input-section">
        <textarea class="chat-container-input" placeholder="Enter your query..."></textarea>
        <button class="material-icons send-icon" title="Send">send</button>
    </div>
</div>
